<script>
    const asciiEl = document.getElementById("ascii-bg");

    let currentTree = 0;
    let cyclingMs = 12000;
    let typing = false;

    function pickNextIndex() {
        if (!TREES.length) return 0;
        let next = Math.floor(Math.random() * TREES.length);
        if (next === currentTree && TREES.length > 1) next = (next + 1) % TREES.length;
        return next;
    }

    function typeInto(el, text, speed = 2) {
        typing = true;
        el.textContent = "";
        let i = 0;

        const tick = () => {
            i += 2;
            el.textContent = text.slice(0, i);

            if (Math.random() < 0.03) {
                el.style.transform = `translate(${(Math.random() - 0.5) * 2}px, ${(Math.random() - 0.5) * 2}px)`;
            } else {
                el.style.transform = "translate(0, 0)";
            }

            if (i < text.length) {
                requestAnimationFrame(tick);
            } else {
                typing = false;
            }
        };

        tick();
    }

    function showTree(index) {
        currentTree = index;
        const t = TREES[index] || "";
        typeInto(asciiEl, t, 2);
    }

    function cycleTrees() {
        if (!typing) showTree(pickNextIndex());
        setTimeout(cycleTrees, cyclingMs);
    }

    let buffer = "";
    function setNightMode(on) {
        document.documentElement.dataset.night = on ? "1" : "0";
        asciiEl.style.opacity = on ? "0.32" : "0.22";
        asciiEl.style.filter = on ? "contrast(1.2)" : "none";
    }


    showTree(Math.floor(Math.random() * TREES.length));
    setTimeout(cycleTrees, cyclingMs);
</script>
<script>
    (() => {
        if (location.hostname !== "sassybutton.buzz") return;

        const badge = document.getElementById("gurt-badge");
        if (!badge) return;

        const pop = document.createElement("div");
        pop.className = "copy-pop";
        pop.textContent = "Click to copy (Paste anywhere you like)";
        pop.setAttribute("role", "status");
        pop.setAttribute("aria-live", "polite");
        badge.appendChild(pop);

        const htmlToCopy = `
<div class="web-badges">
    <a href="https://sassybutton.buzz"
       target="_blank"
       rel="noopener noreferrer"
       class="web-badge"
       title="gurtmuncher sigma baller 67 67">
        <img src="https://sassybutton.buzz/img/gurtmuncher.png"
             alt="gurtmuncher badge"
             loading="lazy"
             width="88"
             height="31">
    </a>
</div>`.trim();

        badge.addEventListener("click", async (e) => {
            e.preventDefault();

            try {
                if (!navigator.clipboard) {
                    throw new Error("Clipboard API not available");
                }

                await navigator.clipboard.writeText(htmlToCopy);

                pop.classList.add("show");
                setTimeout(() => pop.classList.remove("show"), 900);

            } catch (err) {
                console.error("Failed to copy:", err);
                pop.textContent = "Copy failed try again";
                pop.classList.add("show");
                setTimeout(() => {
                    pop.classList.remove("show");
                    pop.textContent = "Click to copy (Paste anywhere you like)";
                }, 1500);
            }
        });
    })();
