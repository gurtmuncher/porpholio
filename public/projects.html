<section class="projects-wrap">
    <h2>projects</h2>
    <p class="subtitle">public repos from <a href="https://github.com/gurtmuncher" target="_blank" rel="noopener noreferrer">github.com/gurtmuncher</a></p>

    <div id="projects-grid" class="projects-grid">
        <p class="projects-loading">loading repos...</p>
    </div>
</section>

<script>
    const LANG_COLORS = {
        "HTML": "#e34c26",
        "CSS": "#563d7c",
        "JavaScript": "#f1e05a",
        "TypeScript": "#3178c6",
        "Python": "#3572A5",
        "Shell": "#89e051",
        "Java": "#b07219"
    };

    function timeAgo(dateStr) {
        const now = new Date();
        const then = new Date(dateStr);
        const diff = Math.floor((now - then) / 1000);
        if (diff < 60) return "just now";
        if (diff < 3600) return Math.floor(diff / 60) + "m ago";
        if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
        if (diff < 2592000) return Math.floor(diff / 86400) + "d ago";
        if (diff < 31536000) return Math.floor(diff / 2592000) + "mo ago";
        return Math.floor(diff / 31536000) + "y ago";
    }

    function renderCard(repo) {
        const lang = repo.language || null;
        const color = LANG_COLORS[lang] || LANG_COLORS["null"];
        const desc = repo.description || "no description";
        const vis = repo.private ? "private" : "public";

        return `
        <div class="project-card">
            <div class="card-top">
                <a class="repo-name" href="${repo.html_url}" target="_blank" rel="noopener noreferrer">${repo.name}</a>
                <span class="repo-vis">${vis}</span>
            </div>
            <p class="repo-desc">${desc}</p>
            <div class="card-meta">
                ${lang ? `<span><span class="lang-dot" style="background:${color}"></span>${lang}</span>` : ""}
                ${repo.stargazers_count > 0 ? `<span>★ ${repo.stargazers_count}</span>` : ""}
                ${repo.forks_count > 0 ? `<span>⑂ ${repo.forks_count}</span>` : ""}
                <span>updated ${timeAgo(repo.updated_at)}</span>
            </div>
        </div>`;
    }

    async function loadRepos() {
        const grid = document.getElementById("projects-grid");
        try {
            const res = await fetch("https://api.github.com/users/gurtmuncher/repos?sort=updated&per_page=30");
            if (!res.ok) throw new Error("GitHub API returned " + res.status);
            const repos = await res.json();

            if (!repos.length) {
                grid.innerHTML = '<p class="projects-loading">no public repos found</p>';
                return;
            }

            repos.sort((a, b) => {
                if (a.fork !== b.fork) return a.fork ? 1 : -1;
                return new Date(b.updated_at) - new Date(a.updated_at);
            });

            grid.innerHTML = repos.map(renderCard).join("");
        } catch (err) {
            grid.innerHTML = `<p class="projects-error">couldn't load repos (if ur on a school chromebook github is prolly blocked thats why not loading) — <a href="https://github.com/gurtmuncher?tab=repositories" target="_blank" style="color:#5b9fff">view on github</a></p>`;
            console.error(err);
        }
    }

    loadRepos();
</script>

<script>
    const asciiEl = document.getElementById("ascii-bg");

    let currentTree = 0;
    let cyclingMs = 12000;
    let typing = false;

    function pickNextIndex() {
        if (!TREES.length) return 0;
        let next = Math.floor(Math.random() * TREES.length);
        if (next === currentTree && TREES.length > 1) next = (next + 1) % TREES.length;
        return next;
    }

    function typeInto(el, text, speed = 2) {
        typing = true;
        el.textContent = "";
        let i = 0;

        const tick = () => {
            i += 2;
            el.textContent = text.slice(0, i);

            if (Math.random() < 0.03) {
                el.style.transform = `translate(${(Math.random() - 0.5) * 2}px, ${(Math.random() - 0.5) * 2}px)`;
            } else {
                el.style.transform = "translate(0, 0)";
            }

            if (i < text.length) {
                requestAnimationFrame(tick);
            } else {
                typing = false;
            }
        };

        tick();
    }

    function showTree(index) {
        currentTree = index;
        const t = TREES[index] || "";
        typeInto(asciiEl, t, 2);
    }

    function cycleTrees() {
        if (!typing) showTree(pickNextIndex());
        setTimeout(cycleTrees, cyclingMs);
    }

    let buffer = "";
    function setNightMode(on) {
        document.documentElement.dataset.night = on ? "1" : "0";
        asciiEl.style.opacity = on ? "0.32" : "0.22";
        asciiEl.style.filter = on ? "contrast(1.2)" : "none";
    }

    showTree(Math.floor(Math.random() * TREES.length));
    setTimeout(cycleTrees, cyclingMs);
</script>
